name: Linux headless

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-headless:
    name: Linux x86_64 headless
    runs-on: ubuntu-latest
    container:
      image: debian:testing

    steps:
      - name: Install build dependencies
        run: |
          apt-get -qq update
          apt-get -qq install --no-install-recommends \
            build-essential ca-certificates cmake file git libcurl4-openssl-dev \
            libexpat1-dev libfreetype-dev libjansson-dev libjpeg-dev \
            libminizip-dev libpcre2-dev libpng-dev libsdl2-dev libsndfile1-dev \
            libspeex-dev libspeexdsp-dev

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure headless client
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build-linux-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DRENDERER_MODERN_OPENGL=OFF \
            -DRENDERER_CLASSIC_OPENGL=OFF

      - name: Build headless client
        run: cmake --build build-linux-release

      - name: Verify and package Linux client
        shell: bash
        run: |
          set -euo pipefail

          binary="build-linux-release/ezquake-linux-x86_64"
          package="ezhbot-tf-linux-x86_64.tar.gz"
          commit_epoch="$(git log -1 --format=%ct)"

          test -x "$binary"
          file "$binary" | tee binary-info.txt
          file "$binary" | grep -q 'ELF 64-bit.*x86-64'
          if strings "$binary" | grep -q '0~000000000'; then
            echo 'Invalid zero Git version metadata in Linux client' >&2
            exit 1
          fi

          mkdir package
          install -m 755 "$binary" package/ezquake-linux-x86_64
          tar --sort=name --mtime="@$commit_epoch" --owner=0 --group=0 \
            --numeric-owner -czf "$package" -C package ezquake-linux-x86_64
          sha256sum "$package" > "$package.sha256"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ezhbot-tf-linux-x86_64
          path: |
            ezhbot-tf-linux-x86_64.tar.gz
            ezhbot-tf-linux-x86_64.tar.gz.sha256
            binary-info.txt
          compression-level: 0
